[project]
name = "pageviews-on-a-laptop"
version = "0.1.0"
description = "Load Wikimedia hourly pageview dumps on one laptop, and prove every row is accounted for."
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["duckdb>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pvl = "pvl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pvl"]
